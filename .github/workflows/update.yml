name: Update VPN Subscription

on:
  schedule:
    - cron: '0 */3 * * *'   # запуск каждые 3 часа
  workflow_dispatch:        # возможность запустить вручную

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run script
        run: |
          python rename_universal.py https://sub.vlessfo.ru/vlessforu/working_configs.txt result.txt

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result.txt
          git commit -m "Auto update subscription" || echo "Nothing to commit"
          git push